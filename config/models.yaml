# ============================================================================
# config/models.yaml — 模型映射表（挂载自宿主机 /deploy/config）
#
# 用途：
#   - entrypoint.sh 根据 category 决定安装哪个 requirements 文件
#   - download_models.py 按 model_id 预下载权重
#   - server.py 读取 category / 默认参数注入适配器
#
# category 取值与 requirements/{category}.txt 一一对应：
#   ocr / asr / tts / image-gen / video-gen / 3d-gen / embedding /
#   detection / robot / code-gen / other
# ============================================================================

